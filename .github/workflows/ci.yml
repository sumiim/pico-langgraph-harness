name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            server/examples/langgraph-pico/pyproject.toml

      - name: Install project
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e examples/langgraph-pico
          python -m pip install pytest

      - name: Check dependencies
        working-directory: server
        run: python -m pip check

      - name: Run tests
        working-directory: server
        run: python -m pytest -q

  build:
    name: Build wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            server/examples/langgraph-pico/pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build native package
        working-directory: server
        run: python -m build --wheel .

      - name: Build LangGraph package
        working-directory: server
        run: python -m build --wheel examples/langgraph-pico

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: pico-wheels
          path: |
            server/dist/*.whl
            server/examples/langgraph-pico/dist/*.whl
