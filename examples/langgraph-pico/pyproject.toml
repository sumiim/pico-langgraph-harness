[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-langgraph-example"
version = "0.1.0"
description = "Optional LangGraph orchestration backend for Pico"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2,<1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
